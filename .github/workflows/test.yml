name: tests

# CI for the plugin's Elixir surface — the same gate mob core runs, so a PR
# gets a green check instead of relying only on each contributor's local
# pre-push hook. mob_deliver is pure Elixir (no NIFs), so this covers it all.
# It runs against mob's master (checked out next to this repo via MOB_PATH):
# mob_deliver often depends on mob changes that aren't on Hex yet, and this
# catches framework drift before either side releases.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      MOB_PATH: ../mob
    defaults:
      run:
        working-directory: mob_deliver
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v4
        with:
          path: mob_deliver

      - uses: actions/checkout@v4
        with:
          repository: GenericJam/mob
          path: mob

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            mob_deliver/deps
            mob_deliver/_build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mob_deliver/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Tests
        run: mix test --exclude macos_only --exclude requires_zig
